<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Daily Tracker - Uganda</title>
<style>
body{font-family:Arial;padding:15px;background:#f5f5f5}
h2{color:#0f7a4a;text-align:center}
.card{background:white;padding:15px;border-radius:10px;margin-bottom:15px;box-shadow:0 2px 5px #ddd}
input,select{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px}
button{width:100%;padding:12px;background:#0f7a4a;color:white;border:none;border-radius:8px;font-size:16px}
table{width:100%;background:white;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
.green{color:green}.red{color:red}
</style>
</head>
<body>
<h2>🇺🇬 Daily Income & Expense</h2>

<div class="card">
<h3>Add Transaction</h3>
<input type="date" id="date">
<input type="text" id="desc" placeholder="Description e.g. Sold tomatoes">
<select id="type"><option>Income</option><option>Expense</option></select>
<select id="cat">
<option>Business Sales</option><option>Salary</option><option>Food</option>
<option>Rent</option><option>Transport</option><option>Stock Purchase</option>
<option>UMEME</option><option>Airtime</option><option>Other</option>
</select>
<input type="number" id="amount" placeholder="Amount UGX e.g. 50000">
<button onclick="add()">+ Add</button>
</div>

<div class="card">
<h3>This Month: <span id="monthLabel"></span></h3>
<p>Income: <b class="green" id="totIn">0</b></p>
<p>Expense: <b class="red" id="totOut">0</b></p>
<p>Balance: <b id="bal">0</b></p>
<p>Savings %: <b id="pct">0%</b></p>
</div>

<div class="card">
<h3>All Transactions</h3>
<table><thead><tr><th>Date</th><th>Desc</th><th>Amount</th><th></th></tr></thead>
<tbody id="list"></tbody></table>
<button onclick="clearAll()" style="background:#c00;margin-top:10px">Clear All Data</button>
</div>

<script>
let data = JSON.parse(localStorage.getItem('tracker')||'[]');
function save(){localStorage.setItem('tracker',JSON.stringify(data)); render();}
function add(){
 let d={date:document.getElementById('date').value||new Date().toISOString().slice(0,10),
 desc:document.getElementById('desc').value,
 type:document.getElementById('type').value,
 cat:document.getElementById('cat').value,
 amount:parseFloat(document.getElementById('amount').value)};
 if(!d.amount||!d.desc){alert('Fill description and amount');return;}
 data.push(d); save(); document.getElementById('desc').value=''; document.getElementById('amount').value='';
}
function render(){
 let m=new Date().toISOString().slice(0,7);
 document.getElementById('monthLabel').innerText=m;
 let inn=0,out=0,html='';
 data.slice().reverse().forEach((t,i)=>{
   if(t.date.startsWith(m)){ if(t.type=='Income') inn+=t.amount; else out+=t.amount; }
   html+=`<tr><td>${t.date}</td><td>${t.desc}<br><small>${t.cat}</small></td><td class="${t.type=='Income'?'green':'red'}">${t.type=='Income'?'+':'-'}${t.amount.toLocaleString()}</td><td><button onclick="del(${data.indexOf(t)})" style="width:auto;padding:5px;background:#eee;color:#000">x</button></td></tr>`;
 });
 document.getElementById('totIn').innerText=inn.toLocaleString();
 document.getElementById('totOut').innerText=out.toLocaleString();
 document.getElementById('bal').innerText=(inn-out).toLocaleString();
 document.getElementById('pct').innerText=inn?Math.round((inn-out)/inn*100)+'%':'0%';
 document.getElementById('list').innerHTML=html;
}
function del(i){data.splice(i,1);save();}
function clearAll(){if(confirm('Delete all?')){data=[];save();}}
render();
</script>
</body>
</html>
